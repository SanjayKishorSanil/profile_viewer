<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      transition: all 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      transform: translateY(-2px);
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 md:px-0">
  <div class="max-w-4xl mx-auto space-y-8 fade-in">
    
    <!-- Profile Header -->
    <div class="card p-8 flex flex-col md:flex-row items-center md:items-start gap-8">
      <div class="w-32 h-32 shrink-0 rounded-full overflow-hidden border-4 border-white shadow-lg">
        <img id="profile-img" src="/images/profile.jpg" alt="Profile" class="w-full h-full object-cover">
      </div>
      <div class="flex-1 text-center md:text-left space-y-3">
        <h1 id="profile-name" class="text-3xl font-bold tracking-tight">Loading...</h1>
        <p id="profile-bio" class="text-slate-500 text-lg"></p>
        <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 text-sm text-slate-600">
          <div class="flex items-center gap-1.5"><i data-lucide="graduation-cap" class="w-4 h-4 text-slate-400"></i> <span id="profile-college"></span></div>
          <div class="flex items-center gap-1.5"><i data-lucide="mail" class="w-4 h-4 text-slate-400"></i> <span id="profile-email"></span></div>
        </div>
        <div class="flex gap-3 justify-center md:justify-start pt-2">
          <a id="profile-github" href="#" target="_blank" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-md transition text-slate-700">
            <i data-lucide="github" class="w-5 h-5"></i>
          </a>
          <a id="profile-linkedin" href="#" target="_blank" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-md transition text-slate-700">
            <i data-lucide="linkedin" class="w-5 h-5"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- Left Column (Education & Skills) -->
      <div class="md:col-span-2 space-y-8">
        <!-- Education -->
        <div class="card p-6">
          <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
            <i data-lucide="book-open" class="w-5 h-5 text-indigo-500"></i> Education
          </h2>
          <div id="education-list" class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- Achievements -->
        <div class="card p-6">
          <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
            <i data-lucide="award" class="w-5 h-5 text-amber-500"></i> Achievements
          </h2>
          <div id="achievements-list" class="space-y-4 text-sm"></div>
        </div>
      </div>

      <!-- Right Column (Skills & AI Chat) -->
      <div class="space-y-8">
        
        <!-- Skills -->
        <div class="card p-6">
          <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
            <i data-lucide="code" class="w-5 h-5 text-emerald-500"></i> Skills
          </h2>
          <div id="skills-list" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- AI Chatbot -->
        <div class="card flex flex-col h-[400px]">
          <div class="p-4 border-b border-slate-100 bg-slate-50/50 rounded-t-xl flex items-center gap-2">
             <i data-lucide="bot" class="w-5 h-5 text-indigo-500"></i>
             <h2 class="font-semibold text-slate-800">Ask about me (AI)</h2>
          </div>
          <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm flex flex-col">
            <div class="bg-indigo-50 text-indigo-900 p-3 rounded-lg rounded-tl-none w-[85%] self-start border border-indigo-100">
              Hi! I'm an AI assistant based on this student's profile. Ask me anything about their education, skills, or background!
            </div>
          </div>
          <div class="p-3 border-t border-slate-100 bg-slate-50/30 rounded-b-xl">
            <form id="chat-form" class="flex gap-2 relative">
              <input type="text" id="chat-input" placeholder="Ask a question..." 
                class="flex-1 text-sm px-3 py-2 pr-10 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-sm bg-white">
              <button type="submit" 
                class="absolute right-1 top-1 bottom-1 w-8 flex items-center justify-center text-indigo-600 hover:text-indigo-800 transition rounded mr-1">
                <i data-lucide="send" class="w-4 h-4"></i>
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
